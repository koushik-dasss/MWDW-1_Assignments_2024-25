<!-- Create an HTML table for a Student Report displaying columns for Student Name, Roll
no, Total Marks, and Grade. The Subjects column should span across three sub-columns
labeled Physics, Chemistry and Maths. Make the first row as a header row and add a
caption titled Student Report. Apply CSS styling to the student report table by including
border, border-collapse, width, height, and padding to enhance the table’s appearance.
Set a distinct background color for the header row and a light color for each even row in
RGBA format. 
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question-1</title>
    <style>
        table{
            border: 10px solid blue;
            border-collapse: collapse;
            width: 200px;
            height: 150px;
            padding: 10px;
        }
        th{
            background-color: rgba(255,0,255,0.8);
        }
        tr:nth-child(even) td {
            background-color: rgba(0, 217, 255, 0.8);
        }

        
    </style>
</head>
<body>
    <table border="1">
        <caption>Student Report</caption>
        <tr>
            <th rowspan="2">Student Name</th>
            <th rowspan="2">Roll No.</th>
            <th colspan="3">Subjects</th>
            <th rowspan="2">Total Marks</th>
            <th rowspan="2">Grade</th>
        </tr>
        <tr>
            <td>Physics</td>
            <td>Chemistry</td>
            <td>Maths</td>
        </tr>
        <tr>
            <td>Koushik Das</td>
            <td>14</td>
            <td>100</td>
            <td>100</td>
            <td>100</td>
            <td>100</td>
            <td>O</td>
        </tr>
        <tr>
            <td>Elon Musk</td>
            <td>29</td>
            <td>69</td>
            <td>69</td>
            <td>69</td>
            <td>100</td>
            <td>D</td>
        </tr>
        <tr>
            <td>Jeff Bezos</td>
            <td>45</td>
            <td>99</td>
            <td>99</td>
            <td>98</td>
            <td>100</td>
            <td>O</td>
        </tr>
        <tr>
            <td>Mark Zuckerberg</td>
            <td>34</td>
            <td>76</td>
            <td>67</td>
            <td>34</td>
            <td>100</td>
            <td>D</td>
        </tr>
        <tr>
            <td>Steve Jobs</td>
            <td>56</td>
            <td>79</td>
            <td>89</td>
            <td>99</td>
            <td>100</td>
            <td>A</td>
        </tr>

    </table>
</body>
</html>
